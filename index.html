<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<title>隣の旅 한국어　単語スタンプ</title>
<!-- ===== PWA(ホーム画面アプリ)設定 ===== -->
<meta name="theme-color" content="#2E7D6B">
<link rel="manifest" href="manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="単語スタンプ">

<!-- ===== /PWA設定 ===== -->
<style>
:root{
  --paper:#F4F6F5; --card:#fff; --ink:#20303A; --soft:#5C6C76;
  --teal:#2E7D6B; --teal-deep:#1F5A4D; --navy:#2E5E7E;
  --red:#C4453C; --gold:#D9A441; --line:#E2E8E6; --radius:18px;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
body{background:var(--paper);color:var(--ink);padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
  font-family:"Hiragino Kaku Gothic ProN","Hiragino Sans","Noto Sans JP","Apple SD Gothic Neo","Noto Sans KR",sans-serif;
  font-size:15px;line-height:1.65;}
.kr{font-family:"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif;}
#app{max-width:560px;margin:0 auto;padding:14px 16px 60px;}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
  padding:18px;margin-bottom:14px;box-shadow:0 1px 4px rgba(32,48,58,.05);}
.eyebrow{font-size:11px;letter-spacing:.15em;color:var(--teal);font-weight:800;margin-bottom:6px;}
h1{font-size:22px;font-weight:800;} h2{font-size:18px;font-weight:800;} h3{font-size:15px;font-weight:800;}
.sub{color:var(--soft);font-size:13px;}
button{font-family:inherit;border:none;cursor:pointer;border-radius:12px;font-size:14px;font-weight:700;transition:transform .07s;}
button:active{transform:scale(.97);}
.bp{background:var(--teal);color:#fff;padding:12px 18px;}
.bn{background:var(--navy);color:#fff;padding:12px 18px;}
.bg{background:transparent;color:var(--teal);border:1.5px solid var(--teal);padding:10px 16px;}
.bs{background:#ECF2F0;color:var(--ink);padding:10px 14px;}
.br{background:var(--red);color:#fff;padding:10px 16px;}
.bx{background:none;color:var(--soft);font-size:12px;padding:4px 0;font-weight:700;}
.full{width:100%;}
input[type=text],input[type=number],input[type=password],select{
  font-family:inherit;font-size:16px;border:1.5px solid var(--line);border-radius:12px;
  padding:11px 13px;background:#fff;color:var(--ink);width:100%;}
input:focus,select:focus{outline:2px solid var(--teal);border-color:var(--teal);}
label.f{font-size:12px;font-weight:800;color:var(--soft);display:block;margin:10px 0 4px;}
.row{display:flex;gap:10px;} .row>*{flex:1;}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;}
.tag{display:inline-block;background:#EAF3F0;color:var(--teal-deep);border-radius:8px;padding:2px 9px;font-size:11px;font-weight:800;}
.tag.red{background:#FBEFEE;color:var(--red);}
.tag.gold{background:#FBF3E2;color:#9A7413;}
.center{text-align:center;}
.hidden{display:none!important;}
/* header */
header{display:flex;align-items:center;justify-content:space-between;padding:4px 2px 12px;}
.logo{display:flex;align-items:baseline;gap:8px;}
.logo b{font-size:22px;font-weight:800;color:var(--teal-deep);letter-spacing:-.5px;}
.logo b span{color:var(--red);}
.logo small{font-size:10px;color:var(--soft);letter-spacing:.12em;}
.whoami{font-size:11px;color:var(--soft);font-weight:700;text-align:right;line-height:1.4;}
/* hanko stamp */
.hanko{width:64px;height:64px;border-radius:50%;border:3px solid var(--red);color:var(--red);
  display:inline-flex;flex-direction:column;align-items:center;justify-content:center;
  font-weight:800;transform:rotate(-8deg);background:rgba(255,255,255,.7);}
.hanko .n{font-size:22px;line-height:1;} .hanko small{font-size:9px;letter-spacing:.05em;}
.hanko.gold{border-color:var(--gold);color:#9A7413;}
.hanko.empty{border:2.5px dashed var(--line);color:var(--line);transform:none;background:none;}
.stamp-row{display:flex;gap:10px;align-items:center;justify-content:center;margin:10px 0 4px;flex-wrap:wrap;}
.progress-note{font-size:12px;color:var(--soft);text-align:center;font-weight:700;}
/* lesson grid */
.lesson-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;}
.lesson-btn{background:#fff;border:1.5px solid var(--line);border-radius:14px;padding:10px 4px;
  font-weight:800;color:var(--ink);font-size:13px;}
.lesson-btn small{display:block;font-size:9px;color:var(--soft);font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
/* ranking */
.rank-row{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);font-size:14px;}
.rank-row:last-child{border:none;}
.rank-row .pos{width:30px;font-weight:800;color:var(--teal-deep);}
.rank-row .nm{flex:1;font-weight:700;}
.rank-row .ct{font-weight:800;color:var(--navy);}
.rank-row.me{background:#F2F8F6;border-radius:10px;padding:8px 10px;}
.battle-bar{height:22px;border-radius:11px;background:#ECF2F0;overflow:hidden;display:flex;margin:4px 0;}
.battle-bar>div{height:100%;}
/* game */
.qword{font-family:"Apple SD Gothic Neo","Noto Sans KR",sans-serif;font-size:34px;font-weight:800;
  text-align:center;letter-spacing:-1px;margin:6px 0;}
.qmean{font-size:22px;font-weight:800;text-align:center;margin:6px 0;}
.choices{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:14px 0;}
.choices button{background:#fff;border:2px solid var(--line);border-radius:14px;padding:16px 8px;
  font-size:16px;font-weight:800;color:var(--ink);min-height:60px;}
.choices button.kr{font-size:20px;}
.choices button.ok{border-color:var(--teal);background:#EDF7F3;}
.choices button.ng{border-color:var(--red);background:#FBEFEE;}
.gfb{min-height:26px;text-align:center;font-weight:800;font-size:15px;}
.gfb.ok{color:var(--teal);} .gfb.ng{color:var(--red);}
.gtop{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--soft);font-weight:800;margin-bottom:6px;}
.pbar{height:8px;border-radius:4px;background:#ECF2F0;overflow:hidden;margin-bottom:12px;}
.pbar>div{height:100%;background:var(--teal);border-radius:4px;transition:width .25s;}
.play-round{width:58px;height:58px;border-radius:50%;background:var(--navy);color:#fff;font-size:22px;
  display:flex;align-items:center;justify-content:center;margin:0 auto;}
/* matching */
.match-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:12px 0;}
.mcard{background:#fff;border:2px solid var(--line);border-radius:12px;padding:12px 6px;
  font-weight:800;font-size:15px;color:var(--ink);min-height:52px;}
.mcard.kr{font-size:18px;color:var(--teal-deep);}
.mcard.sel{border-color:var(--navy);background:#EFF4F8;}
.mcard.gone{opacity:.15;pointer-events:none;border-style:dashed;}
.mcard.flash{border-color:var(--red);background:#FBEFEE;}
/* typing */
.type-row{display:flex;gap:8px;margin:12px 0;}
.type-row input{flex:1;font-size:20px;text-align:center;}
.kbd{display:grid;grid-template-columns:repeat(10,1fr);gap:4px;margin:10px 0 4px;}
.kbd button{background:#fff;border:1.5px solid var(--line);border-radius:8px;padding:11px 0;
  font-size:16px;font-weight:800;color:var(--ink);
  font-family:"Apple SD Gothic Neo","Noto Sans KR",sans-serif;}
.kbd button:active{background:#EAF3F0;}
/* completion card */
.done-card{background:linear-gradient(160deg,#FFFFFF 60%,#F2F8F6);border:2px solid var(--teal);
  border-radius:20px;padding:22px 18px;text-align:center;position:relative;overflow:hidden;}
.done-card .hanko{position:absolute;top:14px;right:14px;width:74px;height:74px;}
.done-card h2{color:var(--teal-deep);font-size:24px;margin:4px 0;}
.done-meta{font-size:13px;color:var(--soft);font-weight:700;line-height:1.9;margin-top:6px;}
.done-meta b{color:var(--ink);}
.code-chip{display:inline-block;background:var(--ink);color:#fff;border-radius:8px;padding:4px 12px;
  font-weight:800;letter-spacing:.1em;font-size:14px;margin-top:8px;}
/* flashcard */
.flash-card{background:#fff;border:2px solid var(--line);border-radius:20px;min-height:180px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding:20px;cursor:pointer;}
/* teacher */
.ttabs{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap;}
.ttabs button{flex:1;min-width:90px;background:#ECF2F0;color:var(--soft);padding:9px 4px;font-size:13px;}
.ttabs button.on{background:var(--navy);color:#fff;}
table{width:100%;border-collapse:collapse;font-size:12px;}
th,td{padding:7px 6px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top;}
th{color:var(--soft);font-size:11px;letter-spacing:.05em;}
.wm-row{display:flex;gap:8px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line);flex-wrap:wrap;}
.wm-row .w{font-weight:800;min-width:90px;} .wm-row .m{flex:1;font-size:13px;color:var(--soft);}
.chk{width:40px;height:24px;border-radius:12px;background:#DDE5E2;position:relative;flex-shrink:0;}
.chk::after{content:'';position:absolute;top:2px;left:2px;width:20px;height:20px;border-radius:50%;background:#fff;transition:left .15s;}
.chk.on{background:var(--teal);} .chk.on::after{left:18px;}
.notice{font-size:12px;color:var(--soft);background:#F1F6F4;border-radius:10px;padding:9px 12px;margin-top:10px;line-height:1.7;}
textarea.csv{width:100%;height:120px;font-size:11px;font-family:monospace;border:1.5px solid var(--line);border-radius:10px;padding:8px;}
textarea.note{width:100%;min-height:70px;font-family:inherit;font-size:14px;border:1.5px solid var(--line);border-radius:12px;padding:10px 13px;background:#fff;color:var(--ink);}
textarea.note:focus{outline:2px solid var(--teal);border-color:var(--teal);}
@media(prefers-reduced-motion:reduce){*{transition:none!important;}}
</style>
</head>

function conjNaive(b,end){
  const st=b.slice(0,-1);
  const last=st.charCodeAt(st.length-1)-0xAC00;
  const jung=Math.floor((last%588)/28), jong=last%28;
  const bright=(jung===0||jung===2||jung===8); // ㅏㅑㅗ
  if(end==='yo')return st+(bright?'아요':'어요');
  if(end==='past')return st+(bright?'았어요':'었어요');

}

        commit();st.v=ch;return;
      }else{
        if(st.c&&st.v){
          if(!st.t){if(HG_JONG.includes(ch)){st.t=ch;return;}commit();st.c=ch;return;}
          const comb=HG_JC[st.t+ch];if(comb){st.t=comb;return;}
          commit();st.c=ch;return;
        }
        if(st.c&&!st.v){commit();st.c=ch;return;}
        st.c=ch;return;
      }
    }
  };
}

const Sync=(()=>{ 
  async function post(payload){
    if(!GAS_URL) return false;
    try{ await fetch(GAS_URL,{method:'POST',headers:{'Content-Type':'text/plain'},body:JSON.stringify(payload)}); return true; }
    catch(e){ return false; }
  }
  async function flushQueue(){
    let q=[]; try{q=JSON.parse(localStorage.getItem('__t_tabi_q')||'[]');}catch(e){}
    if(!q.length) return;
    const rest=[];
    for(const p of q){ if(!(await post(p))) rest.push(p); }
    try{localStorage.setItem('__t_tabi_q',JSON.stringify(rest));}catch(e){}
  }
  function queue(payload){
    let q=[]; try{q=JSON.parse(localStorage.getItem('__t_tabi_q')||'[]');}catch(e){}
    q.push(payload); if(q.length>200)q=q.slice(-200);
    try{localStorage.setItem('__t_tabi_q',JSON.stringify(q));}catch(e){}
  }
  function sendRecord(rec){
    if(!me) return;

      school:schoolName(me.sc), dept:me.fac||'', cls:(me.cls||fixedClass()||''), sid:me.sid, name:me.nm||''
    },rec);
    post(payload).then(ok=>{ if(!ok) queue(payload); });
  }
  window.addEventListener('online',flushQueue);
  setTimeout(flushQueue,4000);
  return {sendRecord,flushQueue};
})();

function getWords(lesson){
  const out=[];

    if(wordsOv.del.includes(id))return;
    const e=wordsOv.edits[id]||{};
    out.push({id,l:lesson,w:e.w||w[1],m:e.m||w[2],r:e.r||''});
  });
  (wordsOv.add[lesson]||[]).forEach((a,i)=>{const id=lesson+'@'+i;
    if(wordsOv.del.includes(id))return;
    out.push({id,l:lesson,w:a.w,m:a.m,r:a.r||''});

function splitSets(pool,size){
  size=size||cfg.setSize||12;
  if(pool.length<=size+2)return [pool];
  const sets=[];for(let i=0;i<pool.length;i+=size)sets.push(pool.slice(i,i+size));
  if(sets.length>1&&sets[sets.length-1].length<5){const last=sets.pop();sets[sets.length-1]=sets[sets.length-1].concat(last);}

}

function countedByDay(plays){
  const per={};plays.forEach(p=>{per[p.d]=(per[p.d]||0)+1;});
  const out={};for(const d in per)out[d]=Math.min(per[d],cfg.dailyCap);
  return out;
}
function weekCount(plays,ws){ws=ws||weekStart();const per=countedByDay(plays);let s=0;
  for(const d in per){if(weekStart(d+'T12:00:00')===ws)s+=per[d];}return s;}
function totalCounted(plays){const per=countedByDay(plays);let s=0;for(const d in per)s+=per[d];return s;}
function stampHistory(plays){ // -> {weeks:{ws:count}, stamps, golds}
  const per=countedByDay(plays);const weeks={};
  for(const d in per){const w=weekStart(d+'T12:00:00');weeks[w]=(weeks[w]||0)+per[d];}
  let st=0,gd=0;for(const w in weeks){if(weeks[w]>=cfg.goldN)gd++;else if(weeks[w]>=cfg.stampN)st++;}
  return {weeks,stamps:st,golds:gd};
}

/* ============ CHOICE / TYPING GAME ENGINE ============ */
function rGame(){
  const gtype=screen.gtype;   // listen | mean | type
  const pool=session.pool;
  let queue=shuffle(pool), total=pool.length, correct=0, miss=0, locked=false;
  const missed=new Set();
  function buildChoices(ans){
    const opts=[ans];const cand=shuffle(pool.filter(x=>x.w!==ans.w&&x.m!==ans.m));
    for(const c of cand){if(opts.length>=4)break;
      if(!opts.some(o=>o.w===c.w||o.m===c.m))opts.push(c);}
    // pool が小さい時は他の課から補充
    if(opts.length<4){let all=[];lessonList().forEach(l=>all=all.concat(getWords(l)));
      for(const c of shuffle(all)){if(opts.length>=4)break;
        if(!opts.some(o=>o.w===c.w||o.m===c.m))opts.push(c);}}
    return shuffle(opts);
  }
  function finish(){
    const score=session.test?Math.round(correct/total*100):100;
    recordAndDone({miss,total,missedList:[...missed],score});
  }
  function draw(){
    if(!queue.length)return finish();
    const it=queue[0];
    const gname={listen:'🎧 聞いて選ぶ',mean:'🀄 意味→単語',type:'⌨️ 書き取り'}[gtype];
    let qhtml='',choicesHtml='';
    if(gtype==='listen'){
      qhtml=`<button class="play-round" id="rep" aria-label="もう一度聞く">🔊</button><p class="sub center" style="margin-top:8px">音声を聞いて、意味をえらぼう（🔊でもう一度）</p>`;
      choicesHtml=buildChoices(it).map(o=>`<button data-w="${esc(o.w)}">${esc(o.m)}</button>`).join('');
    }else if(gtype==='mean'){
      qhtml=`<div class="qmean">${esc(it.m)}</div><p class="sub center">この意味の韓国語は？</p>`;
      choicesHtml=buildChoices(it).map(o=>`<button class="kr" data-w="${esc(o.w)}" data-m="${esc(o.m)}">${esc(o.w)}</button>`).join('');
    }else{
      qhtml=`<div class="qmean">${esc(it.m)}</div>
        <div class="center" style="margin:6px 0"><button class="bg" id="rep">🔊 ヒント（音声）</button></div>
        ${kbNative?
          `<div class="type-row"><input type="text" id="tin" class="kr" placeholder="韓国語で入力" autocomplete="off"><button class="bp" id="tgo">判定</button></div>`:
          `<div class="type-row"><div id="kdisp" class="kr" style="flex:1;border:1.5px solid var(--line);border-radius:12px;padding:11px 13px;font-size:20px;text-align:center;min-height:48px;background:#fff">&nbsp;</div><button class="bp" id="tgo">判定</button></div>
           <div class="kbd" id="kbd"></div>`}
        <div class="center"><button class="bx" id="kbSwitch">${kbNative?'画面キーボードに切り替え':'スマホのキーボードを使う'}</button></div>`;
    }
    view.innerHTML=`
    <button class="bx" id="quit">× やめる</button>
    <section class="card">
      <div class="gtop"><span>${gname} · ${esc(session.label)}</span><span>のこり ${queue.length}問${miss?` · やり直し${miss}`:''}</span></div>
      <div class="pbar"><div style="width:${Math.round(correct/total*100)}%"></div></div>
      ${qhtml}
      ${choicesHtml?`<div class="choices">${choicesHtml}</div>`:''}
      <div class="gfb" id="fb"></div>
    </section>`;
    $('#quit').addEventListener('click',()=>gameSelect(session));
    const rep=$('#rep');if(rep){rep.addEventListener('click',()=>speak(it.w));}
    if(gtype==='listen')speak(it.w);
    function onAnswer(ok,elem){
      if(locked)return;locked=true;
      const fb=$('#fb');
      if(ok){correct++;queue.shift();
        // 苦手モードでは正解したら苦手カウントを減らす
        if(session.mode==='苦手'&&myLog.wr[it.w]>0){myLog.wr[it.w]--;}
        fb.textContent='정답! 正解 ○';fb.className='gfb ok';
        if(gtype!=='listen')speak(it.w);
        setTimeout(()=>{locked=false;draw();},650);
      }else{miss++;missed.add(it.w);
        myLog.wr[it.w]=(myLog.wr[it.w]||0)+1;
        if(session.test)queue.shift();else queue.push(queue.shift());
        fb.innerHTML=`× 正解は <b class="kr">${esc(it.w)}</b>${it.r?` <b class="kr" style="color:var(--red)">${esc(it.r)}</b>`:''}（${esc(it.m)}）${session.test?'':'— あとでもう一度出るよ'}`;fb.className='gfb ng';
        speak(it.w);
        setTimeout(()=>{locked=false;draw();},1400);
      }
    }
    document.querySelectorAll('.choices button').forEach(b=>b.addEventListener('click',()=>{
      const ok=b.dataset.w===it.w&&(gtype!=='mean'||b.dataset.m===it.m);
      b.classList.add(ok?'ok':'ng');
      if(!ok){document.querySelectorAll('.choices button').forEach(x=>{if(x.dataset.w===it.w)x.classList.add('ok');});}
      onAnswer(ok,b);
    }));
    const tgo=$('#tgo');
    if(tgo){
      const sw=$('#kbSwitch');
      if(sw)sw.addEventListener('click',()=>{kbNative=!kbNative;draw();});
      if(kbNative){
        const tin=$('#tin');tin.focus();
        const judge=()=>{const v=tin.value;if(!v.trim())return;onAnswer(normKR(v)===normKR(it.w));};
        tgo.addEventListener('click',judge);
        tin.addEventListener('keydown',e=>{if(e.key==='Enter')judge();});
      }else{
        const comp=makeComposer();const disp=$('#kdisp');
        const upd=()=>{const v=comp.value();disp.textContent=v||'\u00A0';};
        const kb=$('#kbd');
        kb.innerHTML=KBD_ROWS.map(row=>row.map(k=>{
          const wide=k==='␣'?'grid-column:span 6;':'';
          return `<button data-k="${k}" style="${wide}">${k==='␣'?'スペース':k}</button>`;
        }).join('')).join('');
        kb.querySelectorAll('button').forEach(b=>b.addEventListener('click',()=>{
          const k=b.dataset.k;
          if(k==='⌫')comp.bs();else if(k==='␣')comp.space();else comp.input(k);
          upd();
        }));
        tgo.addEventListener('click',()=>{const v=comp.value();if(!v.trim())return;onAnswer(normKR(v)===normKR(it.w));});
      }
    }
  }
  draw();
}

/* ============ MATCHING GAME ============ */
function rMatch(){
  const pool=shuffle(session.pool);
  const bp2=cfg.matchPairs||8;const boards=[];for(let i=0;i<pool.length;i+=bp2)boards.push(pool.slice(i,i+bp2));
  if(boards.length>1&&boards[boards.length-1].length<3){const l=boards.pop();boards[boards.length-1]=boards[boards.length-1].concat(l);}
  let bi=0,miss=0;const missed=new Set();
  function drawBoard(){
    const items=boards[bi];
    let cards=[];items.forEach((it,i)=>{cards.push({side:'w',i,txt:it.w});cards.push({side:'m',i,txt:it.m});});
    cards=shuffle(cards);
    let sel=null,doneCount=0,locked=false;
    view.innerHTML=`
    <button class="bx" id="quit">× やめる</button>
    <section class="card">
      <div class="gtop"><span>🧩 マッチング · ${esc(session.label)}</span><span>ボード ${bi+1}/${boards.length}${miss?` · ミス${miss}`:''}</span></div>
      <p class="sub center">単語と意味のペアをタップ！</p>
      <div class="match-grid">
        ${cards.map((c,ci)=>`<button class="mcard ${c.side==='w'?'kr':''}" data-ci="${ci}">${esc(c.txt)}</button>`).join('')}
      </div>
      <div class="gfb" id="fb"></div>
    </section>`;
    $('#quit').addEventListener('click',()=>gameSelect(session));
    document.querySelectorAll('.mcard').forEach(btn=>btn.addEventListener('click',()=>{
      if(locked)return;
      const ci=Number(btn.dataset.ci),c=cards[ci];
      if(btn.classList.contains('gone'))return;
      if(sel===null){sel=ci;btn.classList.add('sel');if(c.side==='w')speak(c.txt);return;}
      if(sel===ci){btn.classList.remove('sel');sel=null;return;}
      const p=cards[sel],pbtn=document.querySelector(`[data-ci="${sel}"]`);
      if(p.side===c.side){pbtn.classList.remove('sel');sel=ci;btn.classList.add('sel');if(c.side==='w')speak(c.txt);return;}
      locked=true;
      const wIdx=p.side==='w'?p.i:c.i, mIdx=p.side==='m'?p.i:c.i;
      if(wIdx===mIdx){
        pbtn.classList.remove('sel');pbtn.classList.add('gone');btn.classList.add('gone');
        doneCount++;sel=null;locked=false;
        $('#fb').textContent='○';$('#fb').className='gfb ok';
        if(doneCount===items.length){
          bi++;

function conjOpts(it,end){
  const opts=[it[end]];
  const push=v=>{if(v&&!opts.includes(v))opts.push(v);};
  push(conjNaive(it.b,end));
  const alt=end==='yo'?'past':'yo';
  push(it[alt]);push(conjNaive(it.b,alt));
  if(opts.length<4){
    for(const o of shuffle(getConj())){if(opts.length>=4)break;push(o[end]);}
  }
  return shuffle(opts.slice(0,4));
}
function rConj(){

function rBuild(){
  const pool=shuffle(session.sents);
  let queue=pool.slice(), total=pool.length, correct=0, miss=0, locked=false;
  function draw(){
    if(!queue.length)return recordAndDone({miss,total,missedList:[]});
    const it=queue[0];
    const tokens=it.k.replace(/\s+/g,' ').trim().split(' ');
    let bank=shuffle(tokens.map((t,i)=>({t,i})));
    let picked=[];
    function paint(){
      view.innerHTML=`
      <button class="bx" id="quit">× やめる</button>
      <section class="card">
        <div class="gtop"><span>✍ 文づくり · ${esc(session.label)}</span><span>のこり ${queue.length}文${miss?` · やり直し${miss}`:''}</span></div>
        <div class="pbar"><div style="width:${Math.round(correct/total*100)}%"></div></div>
        <div class="qmean" style="font-size:18px">${esc(it.j)}</div>
        <div class="center" style="margin:4px 0"><button class="bg" id="hint">🔊 ヒント（音声）</button></div>
        <div style="min-height:56px;background:#F4F8F7;border-radius:12px;padding:10px;display:flex;flex-wrap:wrap;gap:6px;align-items:center" id="ans">
          ${picked.length?picked.map((p,pi)=>`<button class="mcard kr" data-pi="${pi}" style="min-height:auto;padding:8px 12px">${esc(p.t)}</button>`).join(''):'<span class="sub">下の単語をタップして文を作ろう</span>'}
        </div>
        <div style="display:flex;flex-wrap:wrap;gap:6px;margin-top:10px" id="bank">
          ${bank.map((b,bi)=>`<button class="mcard kr" data-bi="${bi}" style="min-height:auto;padding:8px 12px">${esc(b.t)}</button>`).join('')}
        </div>
        <div class="gfb" id="fb" style="margin-top:8px"></div>
      </section>`;
      $('#quit').addEventListener('click',()=>{ if(session.lesson) go('lesson',{lesson:session.lesson}); else go('home'); });
      $('#hint').addEventListener('click',()=>speak(it.k));
      view.querySelectorAll('[data-bi]').forEach(b=>b.addEventListener('click',()=>{
        if(locked)return;
        const bi=Number(b.dataset.bi);
        picked.push(bank[bi]);bank.splice(bi,1);
        if(!bank.length)judge();else paint();
      }));
      view.querySelectorAll('[data-pi]').forEach(b=>b.addEventListener('click',()=>{
        if(locked)return;
        const pi=Number(b.dataset.pi);
        bank.push(picked[pi]);picked.splice(pi,1);paint();
      }));
    }
    function judge(){
      paint();
      locked=true;
      const ok=picked.map(p=>p.t).join(' ')===tokens.join(' ');
      const fb=$('#fb');
      if(ok){correct++;queue.shift();
        fb.innerHTML=`정답! ○ <b class="kr">${esc(it.k)}</b>`;fb.className='gfb ok';
        speak(it.k);
        setTimeout(()=>{locked=false;draw();},1300);
      }else{miss++;queue.push(queue.shift());
        fb.innerHTML=`× 正解：<b class="kr">${esc(it.k)}</b> — あとでもう一度出るよ`;fb.className='gfb ng';
        speak(it.k);
        setTimeout(()=>{locked=false;draw();},1800);
      }
    }
    paint();
  }
  draw();
}

    <label class="f">苦手 단어 출제 수</label>
    <input type="number" id="wc2" value="${cfg.wrongCount}" min="4" max="30">
    <label class="f">복습 범위 (~이 과까지)</label>
    <select id="revM">${lessonList(true).map(l=>`<option value="${esc(l)}" ${cfg.reviewMax===l?'selected':''}>${dispLesson(l)}까지</option>`).join('')}</select>
    <label class="f">PIN 변경 (비우면 유지)</label>
    <input type="password" id="newPin" placeholder="새 PIN">
    <div style="margin-top:14px"><button class="bn full" id="saveCfg">설정 저장</button></div>
    <div class="gfb ok" id="cfgFb"></div>
    <div class="notice">저장하면 학생들이 다음에 앱을 열 때부터 적용됩니다. 학교는 삭제 대신 '숨김'으로 보관합니다 — 로그인 화면에서는 사라지지만 대시보드·CSV의 기록은 유지됩니다. 이름 변경은 기록에 영향이 없습니다(ID 기반).</div>
  </section>
  <section class="card">
    <div class="eyebrow">데이터 관리</div>
    <div class="grid2">
      <button class="bs" id="expBtn">백업 내보내기</button>
      <button class="bs" id="impShow">백업 가져오기</button>
      <button class="br" id="resetWords">단어 수정사항 초기화</button>
      <button class="br" id="resetLogs">전체 학생 기록 삭제</button>
    </div>
    <textarea class="csv hidden" id="bkTa" placeholder="백업 JSON이 여기에 표시되거나, 여기에 붙여넣고 적용하세요"></textarea>
    <div class="row hidden" id="impRow" style="margin-top:6px"><button class="bn" id="impGo">이 JSON 적용</button></div>
    <div class="gfb" id="dmFb"></div>
    <div class="notice">백업에는 설정·학교 목록·단어 수정사항·체크 태그가 모두 포함됩니다(학생 기록 제외). 초기화·삭제는 버튼을 두 번 눌러야 실행되며, 되돌릴 수 없습니다.</div>
  </section>`;
  function syncSchoolNames(){
    box.querySelectorAll('[data-sn]').forEach(inp=>{
      const i=Number(inp.dataset.sn);const v=inp.value.trim();
      if(v)cfg.schools[i].name=v;});
  }
  function drawSchools(){
    $('#schoolList').innerHTML=cfg.schools.map((s,i)=>`
      <div class="row" style="margin-bottom:6px;align-items:center">
        <input type="text" data-sn="${i}" value="${esc(s.name)}" style="flex:1">
        <button class="${s.active!==false?'bs':'br'}" data-st="${i}" style="flex:0 0 92px">${s.active!==false?'표시 중':'숨김'}</button>
      </div>`).join('');
    $('#schoolList').querySelectorAll('[data-st]').forEach(b=>b.addEventListener('click',()=>{
      syncSchoolNames();
      const i=Number(b.dataset.st);
      cfg.schools[i].active=(cfg.schools[i].active===false);
      drawSchools();}));
  }
  drawSchools();
  $('#addSchool').addEventListener('click',()=>{
    syncSchoolNames();
    cfg.schools.push({id:'s'+Date.now().toString(36),name:'新しい学校',active:true});
    drawSchools();});
  box.querySelectorAll('[data-gt]').forEach(b=>b.addEventListener('click',()=>{
    const k=b.dataset.gt;cfg.games[k]=!cfg.games[k];
    b.className=cfg.games[k]?'bp':'bs';}));
  function arm(btn,label,fn){
    btn.addEventListener('click',async()=>{
      if(btn.dataset.armed!=='1'){btn.dataset.armed='1';btn.textContent='정말 실행? 다시 누르면 진행';
        setTimeout(()=>{btn.dataset.armed='0';btn.textContent=label;},4000);return;}
      btn.dataset.armed='0';btn.textContent=label;await fn();});
  }
  $('#expBtn').addEventListener('click',async()=>{
    const bk=JSON.stringify({cfg,wordsOv});
    const ta=$('#bkTa');ta.classList.remove('hidden');ta.value=bk;
    try{await navigator.clipboard.writeText(bk);$('#dmFb').textContent='백업이 복사되었습니다. 메모장 등에 보관하세요.';$('#dmFb').className='gfb ok';}
    catch(e){$('#dmFb').textContent='아래 텍스트를 직접 복사해 보관하세요.';$('#dmFb').className='gfb ok';}});
  $('#impShow').addEventListener('click',()=>{
    $('#bkTa').classList.remove('hidden');$('#bkTa').value='';$('#impRow').classList.remove('hidden');
    $('#dmFb').textContent='백업 JSON을 붙여넣고 [이 JSON 적용]을 누르세요.';$('#dmFb').className='gfb';});
  $('#impGo').addEventListener('click',async()=>{
    try{const d=JSON.parse($('#bkTa').value);
      if(!d.cfg||!d.wordsOv)throw new Error('형식이 아님');
      cfg=Object.assign({},DEFAULT_CFG,d.cfg);
      cfg.games=Object.assign({},DEFAULT_CFG.games,cfg.games||{});
      wordsOv=Object.assign({tags:{},edits:{},del:[],add:{}},d.wordsOv);
      wordsOv.lessons=Object.assign({ren:{},hidden:[],custom:[]},wordsOv.lessons||{});
      wordsOv.sents=Object.assign({add:{},del:[],edits:{}},wordsOv.sents||{});
      wordsOv.conj=Object.assign({add:[],del:[],edits:{}},wordsOv.conj||{});
      await sSet('cfg1',cfg,true);await sSet('words1',wordsOv,true);
      $('#dmFb').textContent='백업을 적용했습니다.';$('#dmFb').className='gfb ok';
      setTimeout(()=>go('teacher',{ttab:'set'}),600);
    }catch(e){$('#dmFb').textContent='JSON을 읽을 수 없습니다: '+e.message;$('#dmFb').className='gfb ng';}});
  arm($('#resetWords'),'단어 수정사항 초기화',async()=>{
    wordsOv={tags:{},edits:{},del:[],add:{},lessons:{ren:{},hidden:[],custom:[]}};
    await sSet('words1',wordsOv,true);
    $('#dmFb').textContent='단어가 내장 원본(718단어)으로 복원되었습니다.';$('#dmFb').className='gfb ok';});
  arm($('#resetLogs'),'전체 학생 기록 삭제',async()=>{
    const keys=await sList('log2-',true);
    for(const k of keys)await sDel(k,true);
    allLogs=null;
    $('#dmFb').textContent='학생 기록 '+keys.length+'건이 삭제되었습니다.';$('#dmFb').className='gfb ok';});
  $('#saveCfg').addEventListener('click',async()=>{
    syncSchoolNames();
    cfg.hw={on:$('#hwOn').value==='1',lesson:$('#hwL').value,mode:$('#hwM').value,game:$('#hwG').value,
      n:Math.max(1,Number($('#hwN').value)||1),note:$('#hwNote').value.trim()};
    cfg.notice=$('#tNotice').value.trim();
    cfg.appName=$('#appN').value.trim()||'単語スタンプ';
    cfg.shareMsg=$('#shareM').value.trim()||'この画面をスクショして保存しよう📸';
    cfg.matchPairs=Math.min(12,Math.max(4,Number($('#mp').value)||8));
    cfg.reviewCount=Math.min(50,Math.max(5,Number($('#rc').value)||20));
    cfg.wrongCount=Math.min(30,Math.max(4,Number($('#wc2').value)||12));
    cfg.bookTitle=$('#bookT').value.trim()||'隣の旅「韓国語」';
    cfg.showRanking=$('#showR').value==='1';
    cfg.nameMode=$('#nameM').value;
    cfg.classBattle=$('#battle').value==='1';
    cfg.stampN=Math.max(1,Number($('#stampN').value)||3);
    cfg.goldN=Math.max(cfg.stampN,Number($('#goldN').value)||5);
    cfg.dailyCap=Math.max(1,Number($('#cap').value)||5);
    cfg.setSize=Math.min(20,Math.max(6,Number($('#setS').value)||12));
    cfg.reviewMax=$('#revM').value;
    const np=$('#newPin').value.trim();
    if(np){try{const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode('tgs:'+np));cfg.pinH=[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('');delete cfg.pin;}catch(e){cfg.pin=np;}}
    const ok=await sSet('cfg1',cfg,true);
    $('#cfgFb').textContent=ok?'저장되었습니다.':'저장 실패 — 저장소 연결을 확인해주세요.';
  });
}

/* ============ init ============ */
(async function(){
  await loadShared();
  render();
})();
</script>
<script>
if ('serviceWorker' in navigator && location.protocol === 'https:') {
  window.addEventListener('load', function () {
    navigator.serviceWorker.register('sw.js').catch(function(e){ console.log('SW skip:', e); });
  });
}
/* ===== 設置ガイドバナー（未インストール時のみ） ===== */
(function(){
  var KEY='__pwaGuideHide1';
  function isStandalone(){ return window.navigator.standalone===true || matchMedia('(display-mode: standalone)').matches; }
  if(isStandalone()) return;
  try{ if(localStorage.getItem(KEY)==='1') return; }catch(e){}
  var ua=navigator.userAgent;
  var isIOS=/iPhone|iPad|iPod/.test(ua);
  var isCriOS=/CriOS/.test(ua);
  var inApp=/Line\/|Instagram|FBAN|FBAV|KAKAOTALK|Twitter/i.test(ua);
  var deferred=null;
  window.addEventListener('beforeinstallprompt', function(e){ e.preventDefault(); deferred=e; render(); });
  function render(){
    var old=document.getElementById('pwaGuide'); if(old) old.remove();
    var d=document.createElement('div'); d.id='pwaGuide';
    d.style.cssText='position:fixed;left:10px;right:10px;bottom:12px;z-index:9999;background:#1F5A4D;color:#fff;border-radius:16px;padding:14px 44px 14px 16px;font-size:14px;line-height:1.6;box-shadow:0 6px 20px rgba(0,0,0,.25);font-weight:700;';
    var inner='';
    if(inApp){
      inner='⚠️ このままではアプリにできません。<br>右下の「…」や共有メニューから <b>「ブラウザで開く」/「Safariで開く」</b> を選んでください。';
    }else if(isIOS&&isCriOS){
      inner='📲 <b>アプリとして入れよう！</b><br>① アドレスバー横の <b>共有ボタン</b>をタップ<br>② <b>「ホーム画面に追加」</b>を選ぶだけ！';
    }else if(isIOS){
      inner='📲 <b>アプリとして入れよう！</b><br>① 下の <b>共有ボタン（<span style="border:1.5px solid #fff;border-radius:4px;padding:0 5px;">&#x2BAD;</span>）</b>をタップ<br>② <b>「ホーム画面に追加」</b>を選ぶだけ！<div style="text-align:center;font-size:26px;margin-top:2px;">⬇</div>';
    }else if(deferred){
      inner='📲 <b>アプリとして入れよう！</b><br><button id="pwaInstallBtn" style="margin-top:8px;width:100%;padding:11px;border:none;border-radius:12px;background:#C4453C;color:#fff;font-size:15px;font-weight:800;">タップしてインストール</button>';
    }else{
      inner='📲 <b>アプリとして入れよう！</b><br>右上の ⋮ メニュー → <b>「アプリをインストール」</b>（または「ホーム画面に追加」）';
    }
    d.innerHTML=inner+'<button id="pwaGuideClose" style="position:absolute;top:8px;right:10px;background:none;border:none;color:#fff;font-size:20px;font-weight:800;">×</button>';
    document.body.appendChild(d);
    document.getElementById('pwaGuideClose').onclick=function(){ d.remove(); try{localStorage.setItem(KEY,'1');}catch(e){} };
    var b=document.getElementById('pwaInstallBtn');
    if(b) b.onclick=function(){ if(deferred){ deferred.prompt(); deferred.userChoice.then(function(){ d.remove(); }); } };
  }
  if(document.readyState==='complete'||document.readyState==='interactive') render();
  else document.addEventListener('DOMContentLoaded', render);
})();
</script>
