<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>隣の旅 한국어　単語スタンプ</title>
<!-- ===== PWA(ホーム画面アプリ)設定 ===== -->
<meta name="theme-color" content="#2E7D6B">
<link rel="manifest" href="manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="単語スタンプ">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<!-- ===== /PWA設定 ===== -->
<style>
:root{
  --paper:#F3F5F4; --card:#FFFFFF; --ink:#20303A; --soft:#5C6C76;
  --teal:#2E7D6B; --teal-deep:#1F5A4D; --red:#C4453C; --gold:#D9A441;
  --line:#E2E8E6; --cream:#FDFBF4; --teal-bg:#EDF5F2; --red-bg:#FBEFEE;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html{font-size:15px;}
body{
  background:var(--paper); color:var(--ink);
  font-family:"Hiragino Kaku Gothic ProN","Hiragino Sans","Noto Sans JP","Yu Gothic","Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif;
  line-height:1.75; min-height:100vh;
}
.kr{font-family:"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif;}
.wrap{max-width:640px;margin:0 auto;padding:calc(18px + env(safe-area-inset-top,0px)) 14px calc(80px + env(safe-area-inset-bottom,0px));}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;}
input,select{font-family:inherit;font-size:16px;}

/* header */
.appbar{display:flex;align-items:center;gap:10px;margin-bottom:14px;}
.appbar .logo{
  width:46px;height:46px;border-radius:50%;border:3px solid var(--red);color:var(--red);
  display:flex;align-items:center;justify-content:center;font-weight:800;font-size:11px;
  transform:rotate(-8deg);background:rgba(255,255,255,.8);flex-shrink:0;line-height:1.15;text-align:center;
}
.appbar h1{font-size:19px;font-weight:800;color:var(--teal-deep);line-height:1.3;}
.appbar .sub{font-size:11px;color:var(--soft);font-weight:700;}
.appbar .userchip{margin-left:auto;font-size:11px;color:var(--soft);text-align:right;font-weight:700;line-height:1.5;}
.appbar .userchip b{color:var(--teal-deep);}

/* cards & sections */
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px 18px;margin-bottom:14px;position:relative;}
.card.accent::before{content:'';position:absolute;left:0;top:0;bottom:0;width:5px;border-radius:18px 0 0 18px;background:var(--teal);}
.sec-title{font-size:11px;letter-spacing:.18em;color:var(--teal);font-weight:800;margin-bottom:8px;}
.h2{font-size:17px;font-weight:800;color:var(--teal-deep);margin-bottom:8px;}
.small{font-size:12px;color:var(--soft);}
.center{text-align:center;}

/* buttons */
.btn{
  display:block;width:100%;padding:13px 16px;border-radius:14px;font-size:15px;font-weight:800;
  background:var(--teal);color:#fff;text-align:center;box-shadow:0 2px 0 var(--teal-deep);
  transition:transform .05s;
}
.btn:active{transform:translateY(2px);box-shadow:none;}
.btn.secondary{background:#fff;color:var(--teal-deep);border:1.5px solid var(--teal);box-shadow:0 2px 0 var(--line);}
.btn.red{background:var(--red);box-shadow:0 2px 0 #8f2f28;}
.btn.gold{background:var(--gold);box-shadow:0 2px 0 #a87c2a;}
.btn.ghost{background:none;color:var(--soft);box-shadow:none;font-weight:700;font-size:13px;padding:8px;}
.btn:disabled{opacity:.45;pointer-events:none;}
.btnrow{display:flex;gap:10px;}
.btnrow .btn{flex:1;}

/* menu grid */
.menu-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.menu-item{
  background:#fff;border:1.5px solid var(--line);border-radius:14px;padding:14px 12px;text-align:left;
  font-weight:800;font-size:14px;color:var(--ink);
}
.menu-item .mi-icon{font-size:20px;display:block;margin-bottom:4px;}
.menu-item .mi-sub{display:block;font-size:11px;color:var(--soft);font-weight:700;margin-top:2px;line-height:1.4;}
.menu-item:active{border-color:var(--teal);background:var(--teal-bg);}

/* lesson list */
.lesson-list{display:flex;flex-direction:column;gap:8px;max-height:340px;overflow-y:auto;}
.lesson-item{
  display:flex;align-items:center;gap:10px;background:#fff;border:1.5px solid var(--line);
  border-radius:12px;padding:10px 12px;font-size:13.5px;font-weight:700;text-align:left;
}
.lesson-item .ln{
  flex-shrink:0;width:34px;height:34px;border-radius:50%;background:var(--teal);color:#fff;
  display:flex;align-items:center;justify-content:center;font-weight:800;font-size:13px;
}
.lesson-item .lt{flex:1;line-height:1.4;}
.lesson-item .lt .wc{display:block;font-size:11px;color:var(--soft);font-weight:700;}
.lesson-item:active{border-color:var(--teal);background:var(--teal-bg);}
.tabs{display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap;}
.tab{
  padding:7px 13px;border-radius:999px;border:1.5px solid var(--line);font-size:12.5px;font-weight:800;background:#fff;color:var(--soft);
}
.tab.on{background:var(--teal);border-color:var(--teal);color:#fff;}

/* game area */
.game-head{display:flex;align-items:center;gap:8px;margin-bottom:10px;}
.game-head .gh-title{font-weight:800;color:var(--teal-deep);font-size:15px;flex:1;line-height:1.35;}
.progressbar{height:8px;background:var(--line);border-radius:99px;overflow:hidden;margin-bottom:14px;}
.progressbar>div{height:100%;background:var(--teal);border-radius:99px;transition:width .3s;}
.qcount{font-size:11.5px;color:var(--soft);font-weight:800;}

.flashcard{
  background:#fff;border:1.5px solid var(--line);border-radius:20px;min-height:230px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;
  padding:24px 18px;text-align:center;user-select:none;cursor:pointer;
}
.flashcard .fc-ko{font-size:34px;font-weight:800;color:var(--teal-deep);line-height:1.35;}
.flashcard .fc-ja{font-size:17px;color:var(--ink);font-weight:700;}
.flashcard .fc-hint{font-size:11px;color:var(--soft);font-weight:700;}
.fc-hidden{filter:blur(6px);}

.prompt-box{
  background:#fff;border:1.5px solid var(--line);border-radius:16px;padding:22px 16px;text-align:center;margin-bottom:12px;
}
.prompt-box .p-main{font-size:26px;font-weight:800;color:var(--teal-deep);line-height:1.4;}
.prompt-box .p-sub{font-size:13px;color:var(--soft);font-weight:700;margin-top:4px;}
.choices{display:flex;flex-direction:column;gap:9px;}
.choice{
  background:#fff;border:1.5px solid var(--line);border-radius:13px;padding:13px 14px;
  font-size:16px;font-weight:800;text-align:center;color:var(--ink);
}
.choice.correct{background:var(--teal-bg);border-color:var(--teal);color:var(--teal-deep);}
.choice.wrong{background:var(--red-bg);border-color:var(--red);color:var(--red);animation:shake .3s;}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}

/* matching */
.match-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px;}
.match-card{
  background:#fff;border:1.5px solid var(--line);border-radius:12px;padding:13px 8px;min-height:56px;
  font-size:14.5px;font-weight:800;display:flex;align-items:center;justify-content:center;text-align:center;line-height:1.35;
}
.match-card.sel{border-color:var(--gold);background:var(--cream);}
.match-card.done{opacity:.25;pointer-events:none;border-color:var(--teal);}
.match-card.wrong{border-color:var(--red);background:var(--red-bg);animation:shake .3s;}

/* typing */
.type-input{
  width:100%;border:1.5px solid var(--line);border-radius:13px;background:#fff;
  min-height:54px;font-size:24px;font-weight:800;color:var(--teal-deep);text-align:center;
  display:flex;align-items:center;justify-content:center;padding:8px;margin-bottom:10px;line-height:1.3;
}
.type-input .caret{display:inline-block;width:2px;height:1.1em;background:var(--teal);margin-left:2px;animation:blink 1s infinite;vertical-align:-0.15em;}
@keyframes blink{50%{opacity:0}}
.kbd{background:#E9EDEB;border-radius:14px;padding:8px 5px;user-select:none;}
.kbd-row{display:flex;gap:4px;justify-content:center;margin-bottom:5px;}
.key{
  flex:1;max-width:44px;height:44px;background:#fff;border-radius:8px;border:1px solid #D5DBD8;
  font-size:17px;font-weight:800;color:var(--ink);box-shadow:0 1.5px 0 #C9CFCC;
  display:flex;align-items:center;justify-content:center;
}
.key:active{background:var(--teal-bg);}
.key.wide{max-width:64px;font-size:12px;}
.key.space{max-width:150px;flex:3;}
.key.shifted{background:var(--cream);}

/* sentence builder */
.sb-slots,.sb-pool{display:flex;flex-wrap:wrap;gap:8px;min-height:52px;background:#fff;border:1.5px dashed var(--line);border-radius:13px;padding:10px;margin-bottom:12px;}
.sb-pool{border-style:solid;background:var(--cream);border-color:#EDDCC0;}
.word-chip{
  background:#fff;border:1.5px solid var(--teal);color:var(--teal-deep);border-radius:10px;
  padding:8px 12px;font-size:16px;font-weight:800;box-shadow:0 1.5px 0 var(--line);
}
.word-chip:active{transform:translateY(1px);}
.sb-slots .word-chip{border-color:var(--gold);color:var(--ink);background:var(--cream);}

/* feedback */
.feedback{
  border-radius:13px;padding:11px 14px;margin:12px 0;font-size:13.5px;font-weight:800;display:none;line-height:1.6;
}
.feedback.ok{display:block;background:var(--teal-bg);border:1px solid #CDE3DC;color:var(--teal-deep);}
.feedback.ng{display:block;background:var(--red-bg);border:1px solid #EBC7C4;color:var(--red);}

/* hanko stamp / clear card */
.clearcard{
  background:#fff;border:2px solid var(--teal);border-radius:20px;padding:24px 20px;text-align:center;position:relative;overflow:hidden;
}
.clearcard .cc-title{font-size:12px;letter-spacing:.2em;font-weight:800;color:var(--teal);}
.clearcard .cc-score{font-size:44px;font-weight:800;color:var(--teal-deep);line-height:1.2;}
.clearcard .cc-info{font-size:12.5px;color:var(--soft);font-weight:700;line-height:1.8;margin-top:8px;}
.clearcard .cc-code{
  display:inline-block;margin-top:10px;background:var(--cream);border:1px solid #EDDCC0;border-radius:9px;
  padding:5px 12px;font-size:13px;font-weight:800;color:#7A5C1E;letter-spacing:.1em;
}
.hanko{
  position:absolute;right:16px;top:14px;width:74px;height:74px;border-radius:50%;
  border:3px solid var(--red);color:var(--red);display:flex;flex-direction:column;align-items:center;justify-content:center;
  transform:rotate(-10deg);font-weight:800;background:rgba(255,255,255,.82);
}
.hanko .h1{font-size:20px;line-height:1.2;}
.hanko .h2{font-size:9px;letter-spacing:.1em;}
.hanko.gold{border-color:var(--gold);color:#a87c2a;}

/* stamps row */
.stamps{display:flex;gap:8px;justify-content:center;margin:8px 0;}
.stamp-slot{
  width:44px;height:44px;border-radius:50%;border:2px dashed var(--line);
  display:flex;align-items:center;justify-content:center;font-weight:800;color:#C9CFCC;font-size:11px;
}
.stamp-slot.got{border:2.5px solid var(--red);color:var(--red);transform:rotate(-10deg);font-size:15px;background:rgba(255,255,255,.85);}
.stamp-slot.goldgot{border-color:var(--gold);color:#a87c2a;}

/* ranking */
.rank-list{display:flex;flex-direction:column;gap:6px;}
.rank-item{display:flex;align-items:center;gap:10px;background:#fff;border:1px solid var(--line);border-radius:11px;padding:8px 12px;font-size:13.5px;font-weight:700;}
.rank-item .rn{width:26px;height:26px;border-radius:50%;background:var(--teal);color:#fff;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;flex-shrink:0;}
.rank-item.top1 .rn{background:var(--gold);}
.rank-item.me{border:1.5px solid var(--teal);background:var(--teal-bg);}
.rank-item .rname{flex:1;}
.rank-item .rcount{color:var(--teal-deep);font-weight:800;}

/* callouts */
.callout{border-radius:13px;padding:11px 14px;margin:10px 0;font-size:12.5px;line-height:1.7;border:1px solid;font-weight:700;}
.co-warn{background:var(--red-bg);border-color:#EBC7C4;color:#7E2B25;}
.co-tip{background:var(--teal-bg);border-color:#CDE3DC;color:#1F4A40;}
.co-gift{background:var(--cream);border-color:#EDDCC0;color:#6E5313;}

/* login */
.login-field{margin-bottom:12px;}
.login-field label{display:block;font-size:12px;font-weight:800;color:var(--teal-deep);margin-bottom:4px;}
.login-field input{
  width:100%;border:1.5px solid var(--line);border-radius:11px;padding:11px 12px;background:#fff;
}
.school-btns{display:flex;flex-wrap:wrap;gap:8px;}
.school-btn{
  padding:9px 14px;border-radius:11px;border:1.5px solid var(--line);background:#fff;font-weight:800;font-size:13.5px;
}
.school-btn.on{border-color:var(--teal);background:var(--teal-bg);color:var(--teal-deep);}

/* misc */
.pill{display:inline-block;padding:2px 10px;border-radius:99px;font-size:11px;font-weight:800;background:var(--teal-bg);color:var(--teal-deep);margin-left:6px;}
.speak-btn{
  width:44px;height:44px;border-radius:50%;background:var(--teal);color:#fff;font-size:19px;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;box-shadow:0 2px 0 var(--teal-deep);
}
.speak-btn:active{transform:translateY(2px);box-shadow:none;}
.speak-btn.big{width:64px;height:64px;font-size:26px;margin:0 auto 12px;}
.topnav{display:flex;align-items:center;margin-bottom:10px;gap:8px;}
.back-btn{font-size:13px;font-weight:800;color:var(--soft);padding:6px 10px;border-radius:9px;background:#fff;border:1px solid var(--line);}
.offline-banner{
  display:none;background:var(--red-bg);border:1px solid #EBC7C4;color:#7E2B25;border-radius:11px;
  padding:8px 12px;font-size:11.5px;font-weight:800;margin-bottom:12px;line-height:1.5;
}
.confetti{position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:99;}
@media(min-width:520px){ html{font-size:16px;} .key{max-width:48px;height:48px;} }

</style>
</head>

const HG = (() => {
  const CHO = ['ㄱ','ㄲ','ㄴ','ㄷ','ㄸ','ㄹ','ㅁ','ㅂ','ㅃ','ㅅ','ㅆ','ㅇ','ㅈ','ㅉ','ㅊ','ㅋ','ㅌ','ㅍ','ㅎ'];
  const JUNG = ['ㅏ','ㅐ','ㅑ','ㅒ','ㅓ','ㅔ','ㅕ','ㅖ','ㅗ','ㅘ','ㅙ','ㅚ','ㅛ','ㅜ','ㅝ','ㅞ','ㅟ','ㅠ','ㅡ','ㅢ','ㅣ'];
  const JONG = ['','ㄱ','ㄲ','ㄳ','ㄴ','ㄵ','ㄶ','ㄷ','ㄹ','ㄺ','ㄻ','ㄼ','ㄽ','ㄾ','ㄿ','ㅀ','ㅁ','ㅂ','ㅄ','ㅅ','ㅆ','ㅇ','ㅈ','ㅊ','ㅋ','ㅌ','ㅍ','ㅎ'];
  const VCOMB = {'ㅗㅏ':'ㅘ','ㅗㅐ':'ㅙ','ㅗㅣ':'ㅚ','ㅜㅓ':'ㅝ','ㅜㅔ':'ㅞ','ㅜㅣ':'ㅟ','ㅡㅣ':'ㅢ'};
  const JCOMB = {'ㄱㅅ':'ㄳ','ㄴㅈ':'ㄵ','ㄴㅎ':'ㄶ','ㄹㄱ':'ㄺ','ㄹㅁ':'ㄻ','ㄹㅂ':'ㄼ','ㄹㅅ':'ㄽ','ㄹㅌ':'ㄾ','ㄹㅍ':'ㄿ','ㄹㅎ':'ㅀ','ㅂㅅ':'ㅄ'};
  const JSPLIT = {}; Object.keys(JCOMB).forEach(k=>JSPLIT[JCOMB[k]]=[k[0],k[1]]);
  const VSPLIT = {}; Object.keys(VCOMB).forEach(k=>VSPLIT[VCOMB[k]]=[k[0],k[1]]);
  const isCons = c => CHO.includes(c) || 'ㄳㄵㄶㄺㄻㄼㄽㄾㄿㅀㅄ'.includes(c);
  const isVow = c => JUNG.includes(c);
  const S = (cho,jung,jong) => String.fromCharCode(0xAC00 + cho*588 + jung*28 + jong);
  const dec = ch => { const c = ch.charCodeAt(0)-0xAC00; if(c<0||c>11171) return null;
    return {cho: Math.floor(c/588), jung: Math.floor((c%588)/28), jong: c%28}; };
  // compose a string of jamo+syllables progressively: append one jamo to text
  function push(text, j){
    if(!text) return startNew(text, j);
    const last = text.slice(-1); const rest = text.slice(0,-1);
    const d = dec(last);
    if(d){ // last is a full syllable
      if(isVow(j)){
        if(d.jong===0){
          const comb = VCOMB[JUNG[d.jung]+j];
          if(comb) return rest + S(d.cho, JUNG.indexOf(comb), 0);
          return text + j; // can't attach
        } else {
          // move jong (or its tail) to new syllable as cho
          const jongCh = JONG[d.jong];
          if(JSPLIT[jongCh]){
            const [a,b] = JSPLIT[jongCh];
            return rest + S(d.cho, d.jung, JONG.indexOf(a)) + S(CHO.indexOf(b), JUNG.indexOf(j), 0);
          }
          if(CHO.includes(jongCh))
            return rest + S(d.cho, d.jung, 0) + S(CHO.indexOf(jongCh), JUNG.indexOf(j), 0);
          return text + j;
        }
      } else { // consonant
        if(d.jong===0){
          const ji = JONG.indexOf(j);
          if(ji>0) return rest + S(d.cho, d.jung, ji);
          return text + j;
        } else {
          const comb = JCOMB[JONG[d.jong]+j];
          if(comb) return rest + S(d.cho, d.jung, JONG.indexOf(comb));
          return text + j;
        }
      }
    }
    // last is a lone jamo
    if(isCons(last) && isVow(j) && CHO.includes(last))
      return rest + S(CHO.indexOf(last), JUNG.indexOf(j), 0);
    if(isVow(last) && isVow(j)){
      const comb = VCOMB[last+j];
      if(comb) return rest + comb;
    }
    return text + j;
  }
  function startNew(text, j){ return (text||'') + j; }
  // backspace one jamo step
  function pop(text){
    if(!text) return text;
    const last = text.slice(-1); const rest = text.slice(0,-1);
    const d = dec(last);
    if(!d){
      if(VSPLIT[last]) return rest + VSPLIT[last][0];
      return rest;
    }
    if(d.jong!==0){
      const jongCh = JONG[d.jong];
      if(JSPLIT[jongCh]) return rest + S(d.cho,d.jung,JONG.indexOf(JSPLIT[jongCh][0]));
      return rest + S(d.cho,d.jung,0);
    }
    const jungCh = JUNG[d.jung];
    if(VSPLIT[jungCh]) return rest + S(d.cho, JUNG.indexOf(VSPLIT[jungCh][0]), 0);
    return rest + CHO[d.cho];
  }
  return {push, pop, dec, S, CHO, JUNG, JONG};
})();
if (typeof module!=='undefined') module.exports = HG;

/* ===== Korean conjugation engine (아/어요, 았/었어요, (으)면) ===== */
const KCONJ = (() => {
  const CHO = ['ㄱ','ㄲ','ㄴ','ㄷ','ㄸ','ㄹ','ㅁ','ㅂ','ㅃ','ㅅ','ㅆ','ㅇ','ㅈ','ㅉ','ㅊ','ㅋ','ㅌ','ㅍ','ㅎ'];
  const JUNG = ['ㅏ','ㅐ','ㅑ','ㅒ','ㅓ','ㅔ','ㅕ','ㅖ','ㅗ','ㅘ','ㅙ','ㅚ','ㅛ','ㅜ','ㅝ','ㅞ','ㅟ','ㅠ','ㅡ','ㅢ','ㅣ'];
  const JONG = ['','ㄱ','ㄲ','ㄳ','ㄴ','ㄵ','ㄶ','ㄷ','ㄹ','ㄺ','ㄻ','ㄼ','ㄽ','ㄾ','ㄿ','ㅀ','ㅁ','ㅂ','ㅄ','ㅅ','ㅆ','ㅇ','ㅈ','ㅊ','ㅋ','ㅌ','ㅍ','ㅎ'];
  const S = (c,v,f) => String.fromCharCode(0xAC00 + c*588 + v*28 + f);
  const dec = ch => { const c = ch.charCodeAt(0)-0xAC00; if(c<0||c>11171) return null;
    return {cho:Math.floor(c/588), jung:Math.floor((c%588)/28), jong:c%28}; };
  const jongOf = ch => JONG[dec(ch).jong];
  const vowOf = ch => JUNG[dec(ch).jung];
  const setJong = (ch, j) => { const d=dec(ch); return S(d.cho,d.jung,JONG.indexOf(j)); };
  const setVow  = (ch, v) => { const d=dec(ch); return S(d.cho,JUNG.indexOf(v),d.jong); };
  const bright = ch => ['ㅏ','ㅗ','ㅑ','ㅛ'].includes(vowOf(ch));

  // attach 아/어 to an open-final stem syllable, merging when possible.
  // returns the new final syllable string (1 or 2 chars)
  function fuseAEo(last){
    const d = dec(last); const v = vowOf(last);
    if(d.jong!==0) return last + (bright(last)?'아':'어');
    switch(v){
      case 'ㅏ': return last;                       // 가요
      case 'ㅓ': return last;                       // 서요
      case 'ㅕ': return last;                       // 켜요
      case 'ㅐ': case 'ㅔ': return last;            // 보내요, 세요
      case 'ㅗ': return setVow(last,'ㅘ');          // 와요
      case 'ㅜ': return setVow(last,'ㅝ');          // 배워요
      case 'ㅣ': return setVow(last,'ㅕ');          // 마셔요
      case 'ㅚ': return setVow(last,'ㅙ');          // 돼요
      case 'ㅘ': case 'ㅝ': return last;
      default:  return last + (bright(last)?'아':'어'); // ㅡ etc (handled earlier for 으-irregular)
    }
  }
  // add ㅆ to final syllable of an 아/어-fused string
  function addSS(str){ return str.slice(0,-1) + setJong(str.slice(-1),'ㅆ'); }

  const D_IRR = ['듣다','걷다','묻다','싣다','깨닫다','알아듣다','붇다','일컫다'];
  const B_IRR = ['돕다','곱다','덥다','춥다','어렵다','쉽다','맵다','싱겁다','가깝다','무겁다','가볍다','아름답다','고맙다','반갑다','즐겁다','뜨겁다','차갑다','귀엽다','더럽다','부럽다','두렵다','무섭다','밉다','눕다','줍다','굽다','아쉽다','외롭다','괴롭다','새롭다','부드럽다','시끄럽다','안타깝다','아깝다','뵙다','흥미롭다','여유롭다','향기롭다','평화롭다','날카롭다','까다롭다','수줍다','간지럽다','어지럽다','징그럽다','너그럽다'];
  const B_SUF = ['스럽다','럽다','롭다','답다'];
  const S_IRR = ['낫다','짓다','붓다','잇다','긋다','젓다'];
  const H_IRR = ['그렇다','이렇다','저렇다','어떻다','빨갛다','노랗다','파랗다','하얗다','까맣다','동그랗다','커다랗다','조그맣다'];
  const R_EU  = ['따르다','들르다','치르다','다다르다'];

  function detect(base){
    if(!base.endsWith('다')) return '';
    const stem = base.slice(0,-1);
    const last = stem.slice(-1); const d = dec(last);
    if(!d) return '';
    if(stem.endsWith('하')) return '하';
    if(stem.endsWith('되')) return '되';
    if(D_IRR.some(w=>base===w||base.endsWith(w))) return 'ㄷ';
    if(B_IRR.some(w=>base===w||base.endsWith(w)) || (JONG[d.jong]==='ㅂ' && B_SUF.some(sfx=>base.endsWith(sfx)))) return 'ㅂ';
    if(S_IRR.some(w=>base===w||base.endsWith(w))) return 'ㅅ';
    if(H_IRR.some(w=>base===w||base.endsWith(w))) return 'ㅎ';
    const jong = JONG[d.jong]; const vow = JUNG[d.jung];
    if(jong==='ㄹ') return 'ㄹ';
    if(jong==='' && vow==='ㅡ'){
      if(stem.length>=2 && CHO[d.cho]==='ㄹ' && !R_EU.includes(base)){
        const prev = dec(stem.slice(-2,-1));
        if(prev && JONG[prev.jong]==='') return '르';
      }
      return '으';
    }
    return '';
  }

  // base: dictionary form ending in 다. type: ''(auto), 'ㄷ','ㅂ','ㅅ','ㅎ','르','으','ㄹ','하','되','정칙'
  // form: 'yo' | 'past' | 'myeon'
  function conj(base, type, form){
    if(!base.endsWith('다')) return null;
    const stem = base.slice(0,-1);
    const last = stem.slice(-1); const front = stem.slice(0,-1);
    const d = dec(last); if(!d) return null;
    if(!type) type = detect(base);
    if(type==='정칙') type = detectRegularOnly(base);

    switch(type){
      case '하': {
        if(form==='yo')   return front + '해요';
        if(form==='past') return front + '했어요';
        return stem + '면';
      }
      case '되': {
        if(form==='yo')   return front + '돼요';
        if(form==='past') return front + '됐어요';
        return stem + '면';
      }
      case 'ㄷ': { // ㄷ→ㄹ before vowel
        const st = front + setJong(last,'ㄹ');
        if(form==='myeon') return st + '으면';
        const aeo = bright(last)?'아':'어';
        const f = st + aeo;
        return form==='yo' ? f + '요' : addSS(f) + '어요';
      }
      case 'ㅂ': { // ㅂ drop + 우 (돕/곱: 오)
        const st = front + dropJongCh(last);
        const isO = (base==='돕다'||base==='곱다'||stem==='돕'||stem==='곱');
        if(form==='myeon') return st + '우면';
        const f = st + (isO ? '와' : '워');
        return form==='yo' ? f + '요' : addSS(f) + '어요';
      }
      case 'ㅅ': { // ㅅ drop, no vowel merge
        const st = front + dropJongCh(last);
        if(form==='myeon') return st + '으면';
        const aeo = bright(last)?'아':'어';
        const f = st + aeo;
        return form==='yo' ? f + '요' : addSS(f) + '어요';
      }
      case 'ㅎ': { // ㅎ drop; vowel→ㅐ(ㅑ→ㅒ) for 아/어; ㅎ drop for (으)면
        const bare = front + dropJongCh(last);
        const v = vowOf(last);
        const newV = (v==='ㅑ')?'ㅒ':'ㅐ';
        const fused = front + S(d.cho, JUNG.indexOf(newV), 0);
        if(form==='yo')   return fused + '요';
        if(form==='past') return addSS(fused) + '어요';
        return bare + '면';
      }
      case '르': { // X르다 → ㄹ라/ㄹ러
        const mid = stem.slice(-2,-1); const pre = stem.slice(0,-2);
        const withL = pre + setJong(mid,'ㄹ');
        const newSyl = S(CHO.indexOf('ㄹ'), JUNG.indexOf(bright(mid)?'ㅏ':'ㅓ'), 0);
        if(form==='yo')   return withL + newSyl + '요';
        if(form==='past') return withL + setJong(newSyl,'ㅆ') + '어요';
        return stem + '면';
      }
      case '으': { // ㅡ drop
        const prev = stem.length>1 ? stem.slice(-2,-1) : null;
        const aeo = (prev && bright(prev)) ? 'ㅏ' : 'ㅓ';
        const newLast = S(d.cho, JUNG.indexOf(aeo), 0);
        if(form==='yo')   return front + newLast + '요';
        if(form==='past') return front + setJong(newLast,'ㅆ') + '어요';
        return stem + '면';
      }
      case 'ㄹ': { // ㄹ stem: regular for these forms except (으)면 without 으
        if(form==='myeon') return stem + '면';
        const aeo = bright(last)?'아':'어';
        if(form==='yo') return stem + aeo + '요';
        return stem + (aeo==='아'?'았어요':'었어요');
      }
      default: { // regular
        if(form==='myeon') return d.jong===0 ? stem+'면' : stem+'으면';
        if(d.jong===0){
          const f = front + fuseAEo(last);
          return form==='yo' ? f + '요' : addSS(f) + '어요';
        }
        const aeo = bright(last)?'아':'어';
        if(form==='yo') return stem + aeo + '요';
        return stem + (aeo==='아'?'았어요':'었어요');
      }
    }
    function dropJongCh(ch){ const dd=dec(ch); return S(dd.cho,dd.jung,0); }
  }
  function detectRegularOnly(base){ // force regular treatment (for 正則 distractors)
    const stem = base.slice(0,-1); const d = dec(stem.slice(-1));
    if(stem.endsWith('하')) return '하';
    if(stem.endsWith('되')) return '되';
    if(JONG[d.jong]==='ㄹ') return 'ㄹ';
    if(JONG[d.jong]==='' && JUNG[d.jung]==='ㅡ') return '으';
    return 'x'; // plain regular
  }
  function dropJongCh(ch){ const dd=dec(ch); return S(dd.cho,dd.jung,0); }
  return {conj, detect};
})();
if (typeof module!=='undefined') module.exports = KCONJ;

/* ---------- storage (localStorage + in-memory fallback) ---------- */
const Store = (() => {
  let mem = {};
  let ok = true;
  try { localStorage.setItem('__t_std','1'); localStorage.removeItem('__t_std'); }
  catch(e){ ok = false; }
  const get = (k, d) => {
    try { const v = ok ? localStorage.getItem(k) : mem[k]; return v==null ? d : JSON.parse(v); }
    catch(e){ return d; }
  };
  const set = (k, v) => {
    const s = JSON.stringify(v);
    if(ok){ try{ localStorage.setItem(k, s); }catch(e){ mem[k]=s; } } else mem[k]=s;
  };
  return {get, set};
})();

/* ---------- state ---------- */
let profile = Store.get('vs_profile', null);
let progress = Store.get('vs_progress', { clears: [], weak: {}, quizzes: [] });
// clears: [{d:'2026-07-08', code, game, level, lesson}], weak: {'level|ko': {ko,ja,level,miss}}

function saveProgress(){ Store.set('vs_progress', progress); }

/* ---------- date helpers ---------- */
function todayStr(){ const d = new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function weekKey(){ // ISO week starting Monday
  const d = new Date(); const day = (d.getDay()+6)%7; // Mon=0
  const mon = new Date(d); mon.setDate(d.getDate()-day);
  return mon.getFullYear()+'-'+String(mon.getMonth()+1).padStart(2,'0')+'-'+String(mon.getDate()).padStart(2,'0');
}
function isThisWeek(ds){
  const wk = weekKey(); const d = new Date(ds); const w = new Date(wk);
  const diff = (d - w) / 86400000;
  return diff >= 0 && diff < 7;
}

/* weekly clear count (respecting daily max) */
function weeklyClears(){
  const byDay = {};
  progress.clears.forEach(c => { if(isThisWeek(c.d)){ byDay[c.d] = (byDay[c.d]||0)+1; } });
  let total = 0;
  Object.values(byDay).forEach(n => total += Math.min(n, CONFIG.dailyMax));
  return total;
}
function todayClears(){
  return progress.clears.filter(c => c.d === todayStr()).length;
}

/* ---------- TTS ---------- */
const TTS = (() => {
  let koVoice = null;
  function pick(){
    const vs = speechSynthesis.getVoices();
    koVoice = vs.find(v=>v.lang==='ko-KR') || vs.find(v=>v.lang && v.lang.startsWith('ko')) || null;
  }
  if('speechSynthesis' in window){
    pick(); speechSynthesis.onvoiceschanged = pick;
  }
  function speak(text, rate){
    if(!('speechSynthesis' in window)) return;
    try{
      speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(text.replace(/[-()（）?？!！]/g,' '));
      u.lang = 'ko-KR'; if(koVoice) u.voice = koVoice;
      u.rate = rate || 0.85;
      speechSynthesis.speak(u);
    }catch(e){}
  }
  return {speak};
})();

/* ---------- server sync (Google Apps Script) ---------- */
const Sync = (() => {
  let online = !!CONFIG.gasUrl;
  async function post(payload){
    if(!CONFIG.gasUrl) return false;
    try{
      await fetch(CONFIG.gasUrl, { method:'POST', headers:{'Content-Type':'text/plain'}, body: JSON.stringify(payload) });
      online = true; updateBanner(); return true;
    }catch(e){ online = false; updateBanner(); return false; }
  }
  async function getRanking(){
    if(!CONFIG.gasUrl || !profile) return null;
    try{
      const r = await fetch(CONFIG.gasUrl + '?action=ranking&school=' + encodeURIComponent(profile.school) + '&week=' + weekKey());
      online = true; updateBanner();
      return await r.json();
    }catch(e){ online = false; updateBanner(); return null; }
  }
  function updateBanner(){
    const b = document.getElementById('offlineBanner');
    if(!b) return;
    b.style.display = (CONFIG.gasUrl && !online) ? 'block' : 'none';
  }
  function sendRecord(rec){
    const payload = Object.assign({
      action:'record', week: weekKey(), date: todayStr(), ts: Date.now(),
      school: profile.school, dept: profile.dept, sid: profile.sid, name: profile.name
    }, rec);
    post(payload);
  }
  return {sendRecord, getRanking, updateBanner, get online(){return online;}};
})();

/* ---------- misc utils ---------- */
function shuffle(a){ a = a.slice(); for(let i=a.length-1;i>0;i--){ const j = Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function sample(arr, n){ return shuffle(arr).slice(0,n); }
function esc(s){ return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function clearCode(){
  const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
  let s=''; for(let i=0;i<6;i++) s += chars[Math.floor(Math.random()*chars.length)];
  return s;
}
function el(html){ const t = document.createElement('template'); t.innerHTML = html.trim(); return t.content.firstChild; }

/* record a clear (100点 or quiz) */
function recordClear(game, level, lesson, score, retries){
  const code = clearCode();
  progress.clears.push({ d: todayStr(), code, game, level, lesson });
  saveProgress();
  Sync.sendRecord({ game, level, lesson: String(lesson), score, retries: retries||0, code });
  return code;
}

/* weak words */
function addWeak(w, level){
  const key = level + '|' + w.ko;
  if(!progress.weak[key]) progress.weak[key] = { ko: w.ko, ja: w.ja, level, miss: 0 };
  progress.weak[key].miss++;
  saveProgress();
}
function resolveWeak(w, level){
  const key = level + '|' + w.ko;
  if(progress.weak[key]){
    progress.weak[key].miss--;
    if(progress.weak[key].miss <= 0) delete progress.weak[key];
    saveProgress();
  }
}

const $app = () => document.getElementById('app');
const viewStack = [];
function render(fn, push=true){
  if(push) viewStack.push(fn);
  document.querySelectorAll('.confetti').forEach(c=>c.remove());
  window.scrollTo(0,0);
  fn();
}

  const fn = viewStack[viewStack.length-1] || viewHome;

/* ---- distractor pool: same level words ---- */
function distractors(word, pool, n, field){
  const cand = pool.filter(w => w.ko !== word.ko && w.ja !== word.ja);
  return sample(cand, n).map(w => w[field]);
}

/* ============ generic queued quiz core (100点方式) ============ */
/* makeQ(word) -> {render(container, onAnswer), answer} */
function queuedGame(ctx, gameName, makeQuestion){
  let queue = shuffle(ctx.words).map(w => ({w}));
  if(ctx.quiz) queue = queue.slice(0, CONFIG.quizCount);
  const totalFirst = queue.length;
  let retries = 0, firstTryCorrect = 0, answeredFirst = 0, done = 0;
  const firstSeen = new Set();

  function next(){
    if(!queue.length){
      if(ctx.quiz){
        const score = Math.round(firstTryCorrect / totalFirst * 100);
        showQuizResult(ctx, score, gameName);
      } else {
        showClear(ctx, 100, retries, gameName);
      }
      return;
    }
    const item = queue[0];
    const w = item.w;
    const isFirst = !firstSeen.has(w.ko);
    $app().innerHTML = `
      ${topnav(esc(ctx.label) + '｜' + gameName)}
      <div class="progressbar"><div style="width:${done/totalFirst*100}%"></div></div>
      <div class="qcount" style="margin-bottom:8px;">のこり ${queue.length} 問${ctx.quiz?'（小テスト・1回勝負）':''}</div>
      <div id="qbox"></div>
      <div class="feedback" id="fb"></div>`;
    makeQuestion(w, document.getElementById('qbox'), (correct) => {
      const fb = document.getElementById('fb');
      if(isFirst){ firstSeen.add(w.ko); answeredFirst++; if(correct) firstTryCorrect++; }
      if(correct){
        if(fb){ fb.className='feedback ok'; fb.innerHTML = `⭕ 正解！ <span class="kr" style="font-size:15px">${esc(w.ko)}</span> — ${esc(w.ja)}`; }
        resolveWeak(w, ctx.level);
        queue.shift(); done = totalFirst - queue.filter(q=>!firstSeen.has(q.w.ko) || true).length + (totalFirst - queue.length);
        done = totalFirst - queue.length;
        setTimeout(next, 900);
      } else {
        addWeak(w, ctx.level);
        if(ctx.quiz){
          if(fb){ fb.className='feedback ng'; fb.innerHTML = `❌ 正解は <span class="kr" style="font-size:15px">${esc(w.ko)}</span> — ${esc(w.ja)}`; }
          queue.shift(); done = totalFirst - queue.length;
          setTimeout(next, 1400);
        } else {
          retries++;
          if(fb){ fb.className='feedback ng'; fb.innerHTML = `❌ ざんねん…あとでもう一度出ます（正解: <span class="kr" style="font-size:15px">${esc(w.ko)}</span> — ${esc(w.ja)}）`; }
          const it = queue.shift();
          const pos = Math.min(queue.length, 2 + Math.floor(Math.random()*3));
          queue.splice(pos, 0, it);
          setTimeout(next, 1400);
        }
      }
    });
  }
  next();
}

/* ============ matching ============ */
function playMatch(ctx){
  const words = ctx.words;
  const groups = [];
  for(let i=0;i<words.length;i+=6) groups.push(words.slice(i,i+6));
  let g = 0, wrongTotal = 0;

  function drawGroup(){
    if(g >= groups.length){ showClear(ctx, 100, wrongTotal, 'マッチング'); return; }
    const grp = groups[g];
    const cards = shuffle([
      ...grp.map(w => ({t:w.ko, k:'ko', id:w.ko, sp:true})),
      ...grp.map(w => ({t:w.ja, k:'ja', id:w.ko}))
    ]);
    let sel = null, remain = grp.length;
    $app().innerHTML = `
      ${topnav(esc(ctx.label) + '｜🧩 マッチング')}
      <div class="progressbar"><div style="width:${g/groups.length*100}%"></div></div>
      <div class="qcount" style="margin-bottom:8px;">セット ${g+1} / ${groups.length}　韓国語と意味のペアをタップ！</div>
      <div class="match-grid" id="mg"></div>`;
    const mg = document.getElementById('mg');
    cards.forEach((c, idx) => {
      const d = el(`<button class="match-card ${c.k==='ko'?'kr':''}" style="${c.k==='ko'?'color:var(--teal-deep);':''}">${esc(c.t)}</button>`);
      d.onclick = () => {
        if(d.classList.contains('done')) return;
        if(c.sp) TTS.speak(c.t);
        if(sel === null){ sel = {c, d}; d.classList.add('sel'); return; }
        if(sel.d === d){ d.classList.remove('sel'); sel = null; return; }
        if(sel.c.id === c.id && sel.c.k !== c.k){
          d.classList.add('done'); sel.d.classList.add('done'); sel.d.classList.remove('sel');
          sel = null; remain--;
          if(remain === 0){ g++; setTimeout(drawGroup, 700); }
        } else {
          wrongTotal++;
          const w = words.find(x=>x.ko===c.id); if(w) addWeak(w, ctx.level);
          d.classList.add('wrong'); sel.d.classList.add('wrong');
          const pd = sel.d; sel = null;
          setTimeout(()=>{ d.classList.remove('wrong','sel'); pd.classList.remove('wrong','sel'); }, 500);
        }
      };
      mg.appendChild(d);
    });
  }
  drawGroup();
}

/* ---------- on-screen hangul keyboard ---------- */
function buildKeyboard(container, handlers){
  const base = [
    ['ㅂ','ㅈ','ㄷ','ㄱ','ㅅ','ㅛ','ㅕ','ㅑ','ㅐ','ㅔ'],
    ['ㅁ','ㄴ','ㅇ','ㄹ','ㅎ','ㅗ','ㅓ','ㅏ','ㅣ'],
    ['⇧','ㅋ','ㅌ','ㅊ','ㅍ','ㅠ','ㅜ','ㅡ','⌫']
  ];
  const shifted = [
    ['ㅃ','ㅉ','ㄸ','ㄲ','ㅆ','ㅛ','ㅕ','ㅑ','ㅒ','ㅖ'],
    ['ㅁ','ㄴ','ㅇ','ㄹ','ㅎ','ㅗ','ㅓ','ㅏ','ㅣ'],
    ['⇧','ㅋ','ㅌ','ㅊ','ㅍ','ㅠ','ㅜ','ㅡ','⌫']
  ];
  let isShift = false;
  function draw(){
    const rows = isShift ? shifted : base;
    container.innerHTML = '<div class="kbd" id="kbd"></div>';
    const kbd = container.querySelector('#kbd');
    rows.forEach((row) => {
      const r = el('<div class="kbd-row"></div>');
      row.forEach(k => {
        const cls = (k==='⇧'||k==='⌫') ? 'key wide' : 'key kr';
        const b = el(`<button class="${cls} ${isShift&&k==='⇧'?'shifted':''}" type="button">${k}</button>`);
        b.onclick = (e) => {
          e.preventDefault();
          if(k==='⇧'){ isShift = !isShift; draw(); return; }
          if(k==='⌫'){ handlers.onBack(); return; }
          handlers.onKey(k);
          if(isShift){ isShift = false; draw(); }
        };
        r.appendChild(b);
      });
      kbd.appendChild(r);
    });
    const r = el('<div class="kbd-row"></div>');
    const sp = el('<button class="key space" type="button">スペース</button>');
    sp.onclick = () => handlers.onSpace();
    r.appendChild(sp);
    kbd.appendChild(r);
  }
  draw();
}

function burstConfetti(){
  const c = el('<canvas class="confetti"></canvas>');
  document.body.appendChild(c);
  const ctx2 = c.getContext('2d');
  c.width = innerWidth; c.height = innerHeight;
  const colors = ['#2E7D6B','#C4453C','#D9A441','#8FBCB0'];
  const ps = Array.from({length:70}, () => ({
    x: Math.random()*c.width, y: -20-Math.random()*150,
    vx: (Math.random()-.5)*2.4, vy: 2+Math.random()*3.5,
    s: 5+Math.random()*6, r: Math.random()*Math.PI, vr:(Math.random()-.5)*.25,
    col: colors[Math.floor(Math.random()*colors.length)]
  }));
  let t = 0;
  (function tick(){
    ctx2.clearRect(0,0,c.width,c.height);
    ps.forEach(p=>{
      p.x+=p.vx; p.y+=p.vy; p.r+=p.vr;
      ctx2.save(); ctx2.translate(p.x,p.y); ctx2.rotate(p.r);
      ctx2.fillStyle=p.col; ctx2.fillRect(-p.s/2,-p.s/2,p.s,p.s); ctx2.restore();
    });
    if(++t<130) requestAnimationFrame(tick); else c.remove();
  })();
}

/* DATA (embedded): [{level, lessons:[{n,title,words:[[ko,ja]],sents:[[ko,ja]]}]}] */
const BOOKS = DATA.map(b => ({
  level: b.level,
  lessons: b.lessons.map(L => ({
    n: L.n, title: L.title,
    words: L.words.map(x => ({ko: x[0], ja: x[1]})),
    sents: (L.sents||[]).map(x => ({ko: x[0], ja: x[1]}))
  }))
}));
function bookByLevel(lv){ return BOOKS.find(b => b.level === lv); }
function levelPool(lv){ const b = bookByLevel(lv); return b ? b.lessons.flatMap(L => L.words) : []; }

/* verbs/adjectives for conjugation trainer, from all books */
function conjWords(){
  const seen = new Set(); const out = [];
  BOOKS.forEach(b => b.lessons.forEach(L => L.words.forEach(w => {
    const ko = w.ko.trim();
    if(/^[가-힣]{1,5}다$/.test(ko) && !seen.has(ko)){
      seen.add(ko);
      out.push({ko, ja: w.ja, level: b.level, lesson: L.n, type: KCONJ.detect(ko)});
    }
  })));
  return out;
}

/* ===================== LESSON MENU ===================== */
function viewLesson(lv, n){
  const book = bookByLevel(lv); const L = book.lessons.find(x=>x.n===n);
  const sets = [];
  const ws = L.words;
  if(ws.length > CONFIG.basicSetSize + 4){
    for(let i=0;i<ws.length;i+=CONFIG.basicSetSize) sets.push(ws.slice(i, i+CONFIG.basicSetSize));
  } else sets.push(ws);
  const hasConj = ws.some(w => /^[가-힣]{1,5}다$/.test(w.ko.trim()));
  $app().innerHTML = `
    ${topnav(`${esc(lv)} 第${n}課`)}
    <div class="card accent">
      <div class="sec-title">${esc(lv)} · 第${n}課</div>
      <div class="h2">${esc(L.title||'')}</div>
      <div class="small">単語 ${ws.length} 個${L.sents.length ? '・文 '+L.sents.length+' 個' : ''}</div>
    </div>
    <div class="card">
      <div class="sec-title">学習メニュー</div>
      <div style="display:flex;flex-direction:column;gap:9px;" id="lsMenu"></div>
    </div>`;
  const menu = document.getElementById('lsMenu');
  sets.forEach((set, i) => {
    const label = sets.length>1 ? `📘 基本 セット${i+1}（${set.length}語）` : `📘 基本（単語チェック・${set.length}語）`;
    const b = el(`<button class="btn secondary" style="text-align:left;">${label}</button>`);
    b.onclick = () => render(() => viewGameSelect({words:set, pool:levelPool(lv), level:lv, lesson:n, label:`第${n}課 ${sets.length>1?'セット'+(i+1):'基本'}`}));
    menu.appendChild(b);
  });
  if(sets.length>1){
    const b = el(`<button class="btn secondary" style="text-align:left;">📗 チャレンジ（全単語 ${ws.length}語）</button>`);
    b.onclick = () => render(() => viewGameSelect({words:ws, pool:levelPool(lv), level:lv, lesson:n, label:`第${n}課 全単語`}));
    menu.appendChild(b);
  }
  const q = el(`<button class="btn red" style="text-align:left;">📝 小テスト（1回勝負・点数記録）</button>`);
  q.onclick = () => render(() => viewQuizSelect(lv, n, ws));
  menu.appendChild(q);
  if(L.sents.length){
    const s = el(`<button class="btn gold" style="text-align:left;">✍ 文づくり（${L.sents.length}文）</button>`);
    s.onclick = () => render(() => playSentence({level:lv, lesson:n, sents:L.sents, label:`第${n}課 文づくり`}));
    menu.appendChild(s);
  }
  if(hasConj){
    const c = el(`<button class="btn" style="text-align:left;background:var(--teal-deep);">⚡ この課の活用（用言の活用練習）</button>`);
    c.onclick = () => render(() => viewConj(lv, n));
    menu.appendChild(c);
  }
}

/* ===================== SENTENCE BUILDER ===================== */
function playSentence(ctx){
  const sents = shuffle(ctx.sents);
  let i = 0, retries = 0;
  function draw(){
    if(i >= sents.length){ showClear({level:ctx.level, lesson:ctx.lesson, label:ctx.label}, 100, retries, '文づくり'); return; }
    const s = sents[i];
    const parts = s.ko.split(/\s+/).filter(Boolean);
    let pool = shuffle(parts.map((t, idx) => ({t, idx, used:false})));
    let slots = [];
    $app().innerHTML = `
      ${topnav(esc(ctx.label) + '｜✍ 文づくり')}
      <div class="progressbar"><div style="width:${i/sents.length*100}%"></div></div>
      <div class="qcount" style="margin-bottom:8px;">${i+1} / ${sents.length}</div>
      <div class="prompt-box" style="padding:14px;"><div class="p-main" style="font-size:16px;">${esc(s.ja)}</div>
      <div class="p-sub">単語カードを順番にタップして文を完成させよう</div></div>
      <div class="sb-slots" id="slots"></div>
      <div class="sb-pool" id="pool"></div>
      <div class="feedback" id="fb"></div>
      <div class="btnrow">
        <button class="btn secondary" onclick="TTS.speak(${JSON.stringify(s.ko).replace(/"/g,'&quot;')})">🔊 文を聞く</button>
        <button class="btn" id="sbOk">こたえ合わせ</button>
      </div>`;
    const slotsEl = document.getElementById('slots');
    const poolEl = document.getElementById('pool');
    function redraw(){
      slotsEl.innerHTML = ''; poolEl.innerHTML = '';
      slots.forEach((p, si) => {
        const c = el(`<button class="word-chip kr">${esc(p.t)}</button>`);
        c.onclick = () => { slots.splice(si,1); p.used = false; redraw(); };
        slotsEl.appendChild(c);
      });
      pool.forEach(p => {
        if(p.used) return;
        const c = el(`<button class="word-chip kr">${esc(p.t)}</button>`);
        c.onclick = () => { p.used = true; slots.push(p); TTS.speak(p.t); redraw(); };
        poolEl.appendChild(c);
      });
    }
    redraw();
    document.getElementById('sbOk').onclick = () => {
      const fb = document.getElementById('fb');
      const ans = slots.map(p=>p.t).join(' ');
      if(ans === parts.join(' ')){
        fb.className = 'feedback ok'; fb.innerHTML = `⭕ 正解！ <span class="kr">${esc(s.ko)}</span>`;
        TTS.speak(s.ko);
        i++; setTimeout(draw, 1600);
      } else {
        retries++;
        fb.className = 'feedback ng'; fb.textContent = '❌ おしい！ならべ直してみよう';
      }
    };
  }
  draw();
}

/* ===================== CONJUGATION TRAINER ===================== */
const CONJ_TYPES = [
  ['ㄷ','ㄷ不規則', '듣다→들어요'],
  ['ㅂ','ㅂ不規則', '덥다→더워요'],
  ['으','으不規則', '바쁘다→바빠요'],
  ['르','르不規則', '다르다→달라요'],
  ['ㅅ','ㅅ不規則', '낫다→나아요'],
  ['ㅎ','ㅎ不規則', '그렇다→그래요'],
  ['ㄹ','ㄹ語幹', '살다→살면'],
  ['all','全部ミックス','腕試し！']
];
const CONJ_FORMS = [['yo','아/어요（現在）'],['past','았/었어요（過去）'],['myeon','(으)면（仮定）']];

function viewConj(lv, lessonN){
  let words = conjWords();
  let scopeLabel = '全テキスト';
  if(lv && lessonN){
    const L = bookByLevel(lv).lessons.find(x=>x.n===lessonN);
    const lset = new Set(L.words.map(w=>w.ko.trim()));
    const inLesson = words.filter(w => lset.has(w.ko));
    if(inLesson.length >= 4){ words = inLesson; scopeLabel = `${lv} 第${lessonN}課`; }
    else scopeLabel = '全テキスト（この課は用言が少ないため）';
  }
  let selType = 'all', selForm = 'yo';
  function draw(){
    $app().innerHTML = `
      ${topnav('⚡ 活用トレ')}
      <div class="card accent"><div class="sec-title">⚡ 活用トレーニング</div>
      <div class="small">範囲: <b>${esc(scopeLabel)}</b>（用言 ${words.length} 個）</div>
      <div class="callout co-tip" style="margin-bottom:0;"><b>💡 「※正則」もまじっています</b>同じ形でも 덥다→더워요、좁다→좁아요。不規則かどうか見きわめるのも練習！</div></div>
      <div class="card"><div class="sec-title">1. タイプ</div><div class="tabs" id="tType"></div>
      <div class="sec-title" style="margin-top:10px;">2. 語尾</div><div class="tabs" id="tForm"></div>
      <div class="sec-title" style="margin-top:10px;">3. モード</div>
      <div class="btnrow">
        <button class="btn secondary" id="cQuiz">4択クイズ</button>
        <button class="btn" id="cType">入力モード</button>
      </div></div>`;
    const tt = document.getElementById('tType');
    CONJ_TYPES.forEach(([k, name]) => {
      const b = el(`<button class="tab ${selType===k?'on':''}">${name}</button>`);
      b.onclick = () => { selType = k; draw(); };
      tt.appendChild(b);
    });
    const tf = document.getElementById('tForm');
    CONJ_FORMS.forEach(([k, name]) => {
      const b = el(`<button class="tab ${selForm===k?'on':''}">${name}</button>`);
      b.onclick = () => { selForm = k; draw(); };
      tf.appendChild(b);
    });
    document.getElementById('cQuiz').onclick = () => render(() => conjGame(false));
    document.getElementById('cType').onclick = () => render(() => conjGame(true));
  }
  function pickWords(){
    let irr = words.filter(w => selType==='all' ? w.type && w.type!=='하' && w.type!=='되' : w.type===selType);
    let reg = words.filter(w => !w.type || w.type==='하' || w.type==='되');
    // fallback: if the textbook has few of this type, add common examples
    const fallback = {
      'ㄷ':['듣다','걷다','묻다','싣다'],
      'ㅂ':['덥다','춥다','어렵다','쉽다','맵다','가깝다','무겁다','고맙다','귀엽다','눕다'],
      '으':['바쁘다','아프다','예쁘다','쓰다','크다','고프다','슬프다','기쁘다'],
      '르':['다르다','모르다','빠르다','부르다','자르다','고르다','서두르다','흐르다'],
      'ㅅ':['낫다','짓다','붓다','잇다'],
      'ㅎ':['그렇다','어떻다','빨갛다','노랗다','파랗다','하얗다','까맣다'],
      'ㄹ':['살다','알다','만들다','팔다','멀다','길다','놀다','열다','울다','걸다']
    };
    if(selType!=='all' && irr.length < 6){
      (fallback[selType]||[]).forEach(ko => {
        if(!irr.some(w=>w.ko===ko)) irr.push({ko, ja:'', type:selType});
      });
    }
    if(selType==='all'){
      Object.keys(fallback).forEach(t => fallback[t].slice(0,3).forEach(ko => {
        if(!irr.some(w=>w.ko===ko)) irr.push({ko, ja:'', type:t});
      }));
    }
    const regPick = sample(reg.filter(w=>{
      const t = KCONJ.detect(w.ko);
      return t==='' || t==='하' || t==='되';
    }), Math.max(2, Math.floor(irr.length/4)));
    const qs = shuffle(irr.length>10 ? sample(irr,10).concat(regPick.slice(0,3)) : irr.concat(regPick.slice(0,3)));
    return qs;
  }
  function conjGame(typing){
    const qs = pickWords();
    const formName = CONJ_FORMS.find(f=>f[0]===selForm)[1];
    let i = 0, retriesArr = [];
    function q(){
      if(i >= qs.length){ showClear({level:'活用トレ', lesson:'-', label:scopeLabel + '｜' + formName}, 100, retriesArr.length, '⚡活用トレ'); return; }
      const w = qs[i];
      const isIrr = w.type && w.type!=='하' && w.type!=='되' && w.type!=='';
      const answer = KCONJ.conj(w.ko, w.type || '', selForm);
      $app().innerHTML = `
        ${topnav('⚡ 活用トレ｜' + formName)}
        <div class="progressbar"><div style="width:${i/qs.length*100}%"></div></div>
        <div class="qcount" style="margin-bottom:8px;">${i+1} / ${qs.length}</div>
        <div class="prompt-box">
          <div class="p-main kr" style="font-size:30px;">${esc(w.ko)}</div>
          <div class="p-sub">${w.ja?esc(w.ja)+'｜':''}${formName} に活用すると？</div>
        </div>
        <div id="cbox"></div>
        <div class="feedback" id="fb"></div>`;
      const box = document.getElementById('cbox');
      const fb = document.getElementById('fb');
      function result(correct, chosen){
        if(correct){
          fb.className='feedback ok';
          fb.innerHTML = `⭕ 正解！ <span class="kr">${esc(w.ko)} → ${esc(answer)}</span>（${isIrr ? typeName(w.type)+'不規則' : '※正則'}）`;
          TTS.speak(answer);
          i++; setTimeout(q, 1500);
        } else {
          fb.className='feedback ng';
          fb.innerHTML = `❌ 正解は <span class="kr">${esc(answer)}</span>（${isIrr ? typeName(w.type)+'不規則' : '※正則'}）あとでもう一度！`;
          retriesArr.push(w.ko);
          qs.push(w);
          i++; setTimeout(q, 1800);
        }
      }
      if(typing){
        box.innerHTML = `<div class="type-input"><span class="kr" id="typed"></span><span class="caret"></span></div><div id="kb"></div>
        <button class="btn" style="margin-top:10px;" id="ok">こたえ合わせ</button>`;
        let text = '';
        const typed = box.querySelector('#typed');
        buildKeyboard(box.querySelector('#kb'), {
          onKey: j => { text = HG.push(text, j); typed.textContent = text; },
          onBack: () => { text = HG.pop(text); typed.textContent = text; },
          onSpace: () => { text += ' '; typed.textContent = text; }
        });
        let locked=false;
        box.querySelector('#ok').onclick = () => { if(locked)return; locked=true; result(normalizeKo(text)===normalizeKo(answer)); };
      } else {
        const wrongs = conjDistractors(w, selForm, answer);
        const opts = shuffle([answer, ...wrongs]);
        box.innerHTML = '<div class="choices" id="ch"></div>';
        const ch = box.querySelector('#ch');
        let locked = false;
        opts.forEach(o => {
          const b = el(`<button class="choice kr" style="color:var(--teal-deep)">${esc(o)}</button>`);
          b.onclick = () => {
            if(locked) return; locked = true;
            const ok = o === answer;
            b.classList.add(ok?'correct':'wrong');
            if(!ok) ch.querySelectorAll('.choice').forEach(x=>{ if(x.textContent===answer) x.classList.add('correct'); });
            result(ok, o);
          };
          ch.appendChild(b);
        });
      }
    }
    q();
  }
  function typeName(t){ return t==='ㄹ' ? 'ㄹ語幹' : t; }
  function conjDistractors(w, form, answer){
    // wrong = conjugate as-if-regular, or other plausible mistakes
    const set = new Set([answer]);
    const out = [];
    const cand = [];
    const stem = w.ko.slice(0,-1);
    const regular = KCONJ.conj(w.ko, '정칙', form); if(regular) cand.push(regular);
    if(form==='yo'){ cand.push(stem+'어요'); cand.push(stem+'아요'); cand.push(stem+'여요'); }
    if(form==='past'){ cand.push(stem+'었어요'); cand.push(stem+'았어요'); }
    if(form==='myeon'){ cand.push(stem+'으면'); cand.push(stem+'면'); }
    for(const c of cand){ if(c && !set.has(c)){ set.add(c); out.push(c); if(out.length===3) break; } }
    while(out.length<3){ const f = stem+'???'.slice(0,out.length+1); if(!set.has(f)){set.add(f);out.push(f);} }
    return out.slice(0,3);
  }
  draw();
}
